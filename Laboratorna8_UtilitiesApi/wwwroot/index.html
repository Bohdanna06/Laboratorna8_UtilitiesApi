<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Комунальні послуги — Лабораторна №8</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f6f9;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
            margin-top: 30px;
        }

        form, .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #3498db;
            color: white;
            margin-right: 4px;
        }

            button:hover {
                background: #2980b9;
            }

        .btn-edit {
            background: #f39c12;
        }

        .btn-del {
            background: #e74c3c;
        }

        .btn-success {
            background: #27ae60;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #3498db;
            color: white;
        }

        .receipt-box {
            background: #eef7fc;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #bde0f5;
        }

        .total-row {
            font-size: 1.2em;
            text-align: right;
            color: #2c3e50;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-top:0;">1. Мешканці</h2>
        <form id="tenant-form">
            <input type="hidden" id="tenant-id" value="0">
            <input type="text" id="accountNumber" placeholder="Особовий рахунок" required>
            <input type="text" id="fullName" placeholder="ПІБ мешканця" required>
            <input type="text" id="address" placeholder="Адреса" required>
            <input type="number" step="0.01" id="area" placeholder="Площа (м²)" required>
            <input type="number" id="occupantsCount" placeholder="К-сть мешканців" required>
            <button type="submit">Зберегти</button>
            <button type="button" onclick="resetTenantForm()" style="background:#7f8c8d;">Очистити</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Рахунок</th>
                    <th>ПІБ</th>
                    <th>Адреса</th>
                    <th>Площа</th>
                    <th>Мешканців</th>
                    <th>Дії</th>
                </tr>
            </thead>
            <tbody id="tenants-body"></tbody>
        </table>

        <h2>2. Довідник комунальних послуг</h2>
        <form id="service-form">
            <input type="hidden" id="service-id" value="0">
            <input type="text" id="serviceName" placeholder="Назва послуги" required>
            <input type="number" step="0.01" id="rateSq" placeholder="Тариф за м²">
            <input type="number" step="0.01" id="ratePers" placeholder="Тариф на особу">
            <button type="submit">Зберегти послугу</button>
            <button type="button" onclick="resetServiceForm()" style="background:#7f8c8d;">Очистити</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Назва послуги</th>
                    <th>Тариф за м²</th>
                    <th>Тариф на особу</th>
                    <th>Дії</th>
                </tr>
            </thead>
            <tbody id="services-body"></tbody>
        </table>

        <h2>3. Розрахунок квитанції мешканця</h2>
        <div class="controls">
            <select id="receipt-tenant-select" onchange="loadReceipt()">
                <option value="">-- Оберіть мешканця --</option>
            </select>
        </div>

        <div id="receipt-details" class="receipt-box" style="display:none;">
            <p id="receipt-info" style="font-weight:bold; margin-top:0;"></p>

            <div class="controls">
                <select id="receipt-service-select">
                    <option value="">-- Оберіть послугу --</option>
                </select>
                <button type="button" class="btn-success" onclick="assignServiceToTenant()">➕ Підключити послугу</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Підключена послуга</th>
                        <th>Тариф за м²</th>
                        <th>Тариф на особу</th>
                        <th>Нараховано</th>
                        <th>Дії</th>
                    </tr>
                </thead>
                <tbody id="receipt-body"></tbody>
            </table>

            <div class="total-row">
                Всього до сплати: <strong id="receipt-total">0.00 грн</strong>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
